name: Apply qa.23 M6 Conflict Shadow

on:
  push:
    paths:
      - ".github/workflows/qa23-m6-shadow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply qa.23 source patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          p = Path('module/conflicts.mjs')
          s = p.read_text()

          old = '''  const gmMode = interactionMode(gmEntry.action, rangerEntry.action, { ownMissile: sideHasMissile(gmActor, state, "gm", gmWeaponId), opponentMissile: sideHasMissile(rangerActor, state, "ranger", rangerWeaponId) });
          const rangerMode = interactionMode(rangerEntry.action, gmEntry.action, { ownMissile: sideHasMissile(rangerActor, state, "ranger", rangerWeaponId), opponentMissile: sideHasMissile(gmActor, state, "gm", gmWeaponId) });'''
          new = '''  const gmOwnMissile = sideHasMissile(gmActor, state, "gm", gmWeaponId);
          const rangerOwnMissile = sideHasMissile(rangerActor, state, "ranger", rangerWeaponId);
          const gmMode = interactionMode(gmEntry.action, rangerEntry.action, { ownMissile: gmOwnMissile, opponentMissile: rangerOwnMissile });
          const rangerMode = interactionMode(rangerEntry.action, gmEntry.action, { ownMissile: rangerOwnMissile, opponentMissile: gmOwnMissile });
          try {
            Hooks.callAll("realmGuardLegacyConflictInteraction", { conflictId: state.id, side: "gm", ownAction: gmEntry.action, opponentAction: rangerEntry.action, ownMissile: gmOwnMissile, opponentMissile: rangerOwnMissile, legacyMode: gmMode });
            Hooks.callAll("realmGuardLegacyConflictInteraction", { conflictId: state.id, side: "ranger", ownAction: rangerEntry.action, opponentAction: gmEntry.action, ownMissile: rangerOwnMissile, opponentMissile: gmOwnMissile, legacyMode: rangerMode });
          } catch (_error) { /* M6 shadow observer must never interrupt Conflict */ }'''
          assert old in s, 'reveal interaction block not found'
          s = s.replace(old, new, 1)

          old = '''  const gmZero = Number(next.gm.disposition.current ?? 0) <= 0, rangerZero = Number(next.ranger.disposition.current ?? 0) <= 0;'''
          new = '''  try {
            Hooks.callAll("realmGuardLegacyConflictResolution", {
              conflictId: next.id,
              exchange: next.exchange,
              pair: { index: pair.index, gmAction: pair.gmAction, rangerAction: pair.rangerAction, gmMode, rangerMode },
              gmRoll,
              rangerRoll: rr,
              beforeDisposition: {
                gm: { start: next.gm.disposition.start, current: beforeGm },
                ranger: { start: next.ranger.disposition.start, current: beforeRanger }
              },
              gmPassed,
              rangerPassed: rPassed,
              gmMargin,
              rangerMargin: rMargin,
              gmFailureMargin,
              rangerFailureMargin: rFailureMargin,
              gmEffectiveSuccesses: gmRaw,
              rangerEffectiveSuccesses: rRaw,
              gmDisposition: next.gm.disposition.current,
              rangerDisposition: next.ranger.disposition.current,
              tiePending: false,
              maneuverQueue: maneuverPending
            });
          } catch (_error) { /* M6 shadow observer must never interrupt Conflict */ }

          const gmZero = Number(next.gm.disposition.current ?? 0) <= 0, rangerZero = Number(next.ranger.disposition.current ?? 0) <= 0;'''
          assert old in s, 'resolution observation target not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('realm-guard.mjs')
          s = p.read_text()
          anchor = 'import { installM5CoreServices } from "./module/m5-core-service.mjs";\n'
          if 'installM6ConflictShadow' not in s:
            assert anchor in s
            s = s.replace(anchor, anchor + 'import { installM6ConflictShadow } from "./module/m6-conflict-shadow.mjs";\n', 1)
          s = s.replace('installM5CoreServices();\n', 'installM5CoreServices();\n  installM6ConflictShadow();\n', 1)
          s = s.replace('1.7.0-qa.22', '1.8.0-qa.1')
          p.write_text(s)

          p = Path('system.json')
          m = json.loads(p.read_text())
          m['version'] = '1.8.0-qa.1'
          m['download'] = 'https://github.com/GuteboysFactory/RealmGuard-Torchbearer/releases/download/1.8.0-qa.1/realm-guard.zip'
          p.write_text(json.dumps(m, indent=2) + '\n')

          Path('qa/m6-conflict-shadow-smoke.mjs').write_text('''import assert from "node:assert/strict";\nimport { m6InteractionMode, resolveM6ConflictPair, previewM6ConflictResolution } from "../module/core/m6-conflict-services.mjs";\n\nassert.equal(m6InteractionMode("attack", "attack"), "independent");\nassert.equal(m6InteractionMode("attack", "attack", { ownMissile: true }), "versus");\nassert.equal(m6InteractionMode("defend", "feint"), "trumped");\n\nlet r = resolveM6ConflictPair({ gmAction: "attack", rangerAction: "defend", gmMode: "versus", rangerMode: "versus", gmRoll: { successes: 4 }, rangerRoll: { successes: 2 } });\nassert.equal(r.gm.passed, true);\nassert.equal(r.gm.margin, 2);\nassert.equal(r.ranger.passed, false);\n\nr = resolveM6ConflictPair({ gmAction: "attack", rangerAction: "defend", gmMode: "versus", rangerMode: "versus", gmRoll: { successes: 2 }, rangerRoll: { successes: 2 } });\nassert.equal(r.tiePending, true);\n\nconst preview = previewM6ConflictResolution({ gmAction: "attack", rangerAction: "defend", gmMode: "versus", rangerMode: "versus", gmRoll: { successes: 4 }, rangerRoll: { successes: 2 }, gmDisposition: { start: 8, current: 8 }, rangerDisposition: { start: 7, current: 7 } });\nassert.equal(preview.disposition.ranger.current, 5);\nassert.equal(preview.disposition.gm.current, 8);\n\nconsole.log("PASS m6-conflict-shadow-smoke");\n''')

          Path('TEST_PROTOCOL_v1.8.0-qa.1.md').write_text('''# Realm Guard / Torchbearer v1.8.0-qa.1 QA Protocol\n\n## Scope\nM6 Conflict Engine refactor begins in shadow-only mode. Legacy Mixed remains the sole live authority. CORE independently recomputes action interaction mode, pass/fail, margins, effective successes, disposition delta and Maneuver queue, then compares against the completed Legacy resolution.\n\n## 1. Initial status\n```js\ngame.system.version\ngame.realmGuard.core.m6.getStatus()\n```\nExpected: `1.8.0-qa.1`, phase `M6`, mode `SHADOW_PARITY`, authority `LEGACY_MIXED`, `liveApplication:false`, `mismatches:0`.\n\n## 2. Clear M6 history\n```js\ngame.realmGuard.core.m6.clear()\n```\n\n## 3. Versus resolution\nPlay one normal Versus action pair such as Attack vs Defend. After resolution:\n```js\ngame.realmGuard.core.m6.getStatus()\ngame.realmGuard.core.m6.history().slice(-6)\n```\nExpected interaction rows `MATCH` and one `RESOLVE_ACTION_PAIR` row `MATCH`. Check pass/fail, margin, effective successes and both disposition values.\n\n## 4. Independent resolution\nPlay an Independent pair, preferably Attack vs Attack without missile weapons or Feint vs Defend where the legal matrix produces an independent/trumped combination. Expected `MATCH`; CORE disposition preview equals Legacy.\n\n## 5. Missile interaction exception\nUse Attack vs Attack with Bow or Sling on either side. Expected interaction mode `versus` on both sides and parity `MATCH`.\n\n## 6. Maneuver resolution\nResolve a successful Maneuver with margin > 0. Expected `RESOLVE_ACTION_PAIR` parity `MATCH` and CORE `maneuverQueue` matching Legacy side+margin. Complete the normal Legacy Maneuver choice and verify gameplay remains unchanged.\n\n## 7. Conditional successes / penalties regression\nUse one Tool that produces conditional +s or -s. Expected M6 resolution parity `MATCH`. This proves M6 consumes the already-verified M5 live Tool evaluation correctly.\n\n## 8. Regression\nVerify Conflict state, chat card, disposition, Learning/Nature tax, Maneuver UI, action advancement, next exchange and Token Actor resolution all behave exactly as before. No red console errors.\n\n## PASS\nAt least one Versus, one Independent, missile exception and Maneuver resolution observed; all M6 rows MATCH; `mismatches:0`; Legacy remains live authority.\n''')

          Path('release/NOTES.md').write_text('''Realm Guard / Torchbearer v1.8.0-qa.1 — M6 Conflict Engine shadow foundation.\n\nM5 is now treated as verified for controlled live Inventory validation and Conflict Tool evaluation. M6 begins the Conflict Engine refactor without taking live authority.\n\nNew CORE shadow services independently calculate:\n- Conflict Action interaction mode, including Attack-vs-Attack missile exception\n- Versus and Independent pass/fail\n- effective successes, margins and failure margins\n- Attack/Feint disposition damage\n- Defend disposition recovery with cap\n- pending Maneuver side + margin\n\nLegacy Mixed remains the sole live Conflict resolution/state authority. M6 only observes completed Legacy results and reports MATCH/MISMATCH. No CORE state writes are performed.\n\nPreserved: M5 live handoffs, qa.22 Token Actor resolution, current Conflict UX, Learning/Nature handling and all previous CORE milestones.\n\nQA protocol: TEST_PROTOCOL_v1.8.0-qa.1.md\n''')

          compat = Path('qa/m5-foundry-filepicker-compat-smoke.mjs')
          if compat.exists():
            cs = compat.read_text().replace('1.7.0-qa.22', '1.8.0-qa.1')
            compat.write_text(cs)
          Path('release/READY').write_text('1.8.0-qa.1\n')
          PY

          node --check module/conflicts.mjs
          node --check module/core/m6-conflict-services.mjs
          node --check module/m6-conflict-shadow.mjs
          node --check realm-guard.mjs
          for smoke in qa/*-smoke.mjs; do node "$smoke"; done

          rm -f .github/workflows/qa23-m6-shadow.yml
          git config user.name "GuteboysFactory"
          git config user.email "per@guteboy.eu"
          git add -A
          git commit -m "Release v1.8.0-qa.1 M6 conflict shadow foundation"
          git push
