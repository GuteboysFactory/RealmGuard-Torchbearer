name: Apply qa.3 M6 Resolution Handoff
on:
  push:
    paths:
      - '.github/workflows/qa25-m6-resolution-handoff.yml'
jobs:
  patch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.8.0-qa.3 resolution handoff patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa25_apply.py
          node --check module/conflicts.mjs
          node --check module/core/m6-conflict-services.mjs
          node --check module/m6-conflict-shadow.mjs
          node --check module/m6-conflict-live-handoff.mjs
          node --check realm-guard.mjs
          for smoke in qa/*-smoke.mjs; do node "$smoke"; done
          rm -f tools/qa25_apply.py .github/workflows/qa25-m6-resolution-handoff.yml
          git config user.name "GuteboysFactory"
          git config user.email "per@guteboy.eu"
          git add -A
          git commit -m "Release v1.8.0-qa.3 controlled M6 resolution handoff"
          git push
