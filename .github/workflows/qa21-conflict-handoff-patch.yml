name: Apply qa.21 Conflict Handoff

on:
  push:
    paths:
      - "tools/qa21-apply.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply qa.21 source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          p = Path('module/conflicts.mjs')
          s = p.read_text()
          old_import = 'import { traitPositiveStatus } from "./traits.mjs";\n'
          new_import = old_import + 'import { evaluateM5ConflictToolLiveHandoff } from "./m5-conflict-live-handoff.mjs";\n'
          if 'evaluateM5ConflictToolLiveHandoff' not in s:
              assert old_import in s
              s = s.replace(old_import, new_import, 1)

          old = '''  if (dialog.lockSword && gear.hasSword && !gear.swordAction) gear.dice += 1;\n  if (gear.requirement && !dialog.weaponRequirementMet) { gear.dice = 0; gear.conditionalSuccess = 0; gear.successPenalty = 0; gear.notes = [`${gear.toolName}: requirement not met — no bonus`]; }\n  const source = choices.find(c => c.id === dialog.sourceId) ?? choices[0];\n  const roll = await executeActorPool({ actor, source, modifier: dialog.modifier, extra: dialog.extra, persona: dialog.persona, traitId: dialog.traitId, wiseId: dialog.wiseId, tokenPowerId: dialog.tokenPowerId, talentId: dialog.talentId, helperIds: dialog.helperIds, temporaryDice: tactical, gear, label: actionLabel(action), contextKey: state.id, tapNature: dialog.tapNature, natureScope: dialog.natureScope });'''
          new = '''  if (dialog.lockSword && gear.hasSword && !gear.swordAction) gear.dice += 1;\n  if (gear.requirement && !dialog.weaponRequirementMet) { gear.dice = 0; gear.conditionalSuccess = 0; gear.successPenalty = 0; gear.notes = [`${gear.toolName}: requirement not met — no bonus`]; }\n  const swordUsefulAction = dialog.lockSword ? action : String(state.effects?.[side]?.swordActions?.[actor.id] ?? state.effects?.[side]?.swordAction ?? gear.swordAction ?? "");\n  const liveGear = evaluateM5ConflictToolLiveHandoff({ actor, state, side, toolId: actionWeaponId, action, legacy: gear, requirementMet: dialog.weaponRequirementMet, swordUsefulAction });\n  const source = choices.find(c => c.id === dialog.sourceId) ?? choices[0];\n  const roll = await executeActorPool({ actor, source, modifier: dialog.modifier, extra: dialog.extra, persona: dialog.persona, traitId: dialog.traitId, wiseId: dialog.wiseId, tokenPowerId: dialog.tokenPowerId, talentId: dialog.talentId, helperIds: dialog.helperIds, temporaryDice: tactical, gear: liveGear, label: actionLabel(action), contextKey: state.id, tapNature: dialog.tapNature, natureScope: dialog.natureScope });'''
          assert old in s, 'rollCurrentAction target block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('module/m5-core-service.mjs')
          s = p.read_text()
          old = 'import { createM5ParityBridge } from "./m5-parity-bridge.mjs";\n'
          new = old + 'import { getM5ConflictLiveHandoffStatus, getM5ConflictHandoffHistory, resetM5ConflictHandoffTelemetry, setM5ConflictCoreEvaluationEnabled } from "./m5-conflict-live-handoff.mjs";\n'
          if 'getM5ConflictLiveHandoffStatus' not in s:
              assert old in s
              s = s.replace(old, new, 1)
          s = s.replace('const inventoryHandoff = getM5InventoryLiveHandoffStatus();', 'const inventoryHandoff = getM5InventoryLiveHandoffStatus();\n  const conflictHandoff = getM5ConflictLiveHandoffStatus();', 1)
          s = s.replace('buildScope: "CONTROLLED_INVENTORY_VALIDATION_HANDOFF",', 'buildScope: "CONTROLLED_INVENTORY_AND_CONFLICT_EVALUATION_HANDOFF",', 1)
          s = s.replace('liveApplication: inventoryHandoff.enabled,', 'liveApplication: inventoryHandoff.enabled || conflictHandoff.enabled,', 1)
          s = s.replace('conflict: "LEGACY_MIXED"', 'conflictEvaluation: conflictHandoff.evaluationAuthority,\n      conflictState: conflictHandoff.conflictStateAuthority', 1)
          s = s.replace('inventoryHandoff,', 'inventoryHandoff,\n    conflictHandoff,', 1)
          s = s.replace('conflictLiveTakeover: false,', 'conflictEvaluationLiveTakeover: conflictHandoff.enabled,\n      conflictStateLiveTakeover: false,', 1)
          old_block = '''    conflictTools: Object.freeze({\n      list: (actor, options) => current.conflictTools.list(actor, options),\n      resolve: (actor, id, options) => current.conflictTools.resolve(actor, id, options),\n      evaluate: (actor, options) => current.conflictTools.evaluate(actor, options),\n      disableTargets: (actor, options) => current.conflictTools.disableTargets(actor, options)\n    }),'''
          new_block = '''    conflictTools: Object.freeze({\n      list: (actor, options) => current.conflictTools.list(actor, options),\n      resolve: (actor, id, options) => current.conflictTools.resolve(actor, id, options),\n      evaluate: (actor, options) => current.conflictTools.evaluate(actor, options),\n      disableTargets: (actor, options) => current.conflictTools.disableTargets(actor, options),\n      handoffStatus: getM5ConflictLiveHandoffStatus,\n      handoffHistory: getM5ConflictHandoffHistory,\n      resetHandoffTelemetry: resetM5ConflictHandoffTelemetry,\n      rollback: reason => setM5ConflictCoreEvaluationEnabled(false, { reason: reason || "MANUAL_QA_ROLLBACK" }),\n      enableCoreEvaluation: () => setM5ConflictCoreEvaluationEnabled(true, { reason: "MANUAL_QA_ENABLE" })\n    }),'''
          assert old_block in s
          s = s.replace(old_block, new_block, 1)
          s = s.replace('console.log("realm-guard | CORE M5 controlled Inventory validation handoff ready", getM5Status());', 'console.log("realm-guard | CORE M5 controlled Inventory + Conflict Tool evaluation handoff ready", getM5Status());', 1)
          p.write_text(s)

          p = Path('realm-guard.mjs')
          s = p.read_text().replace('1.7.0-qa.20', '1.7.0-qa.21')
          p.write_text(s)

          p = Path('system.json')
          m = json.loads(p.read_text())
          m['version'] = '1.7.0-qa.21'
          m['download'] = 'https://github.com/GuteboysFactory/RealmGuard-Torchbearer/releases/download/1.7.0-qa.21/realm-guard.zip'
          p.write_text(json.dumps(m, indent=2) + '\n')

          smoke = Path('qa/m5-conflict-live-handoff-smoke.mjs')
          smoke.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport { compareM5ConflictEvaluation } from "../module/m5-conflict-live-handoff.mjs";\n\nassert.equal(compareM5ConflictEvaluation({ legacy: { dice: 2, conditionalSuccess: 0, successPenalty: 0 }, core: { dice: 2, conditionalSuccess: 0, successPenalty: 0, tool: { id: "gear:bow" } }, toolId: "gear:bow" }).match, true);\nassert.equal(compareM5ConflictEvaluation({ legacy: { dice: 1 }, core: { dice: 2, tool: { id: "gear:bow" } }, toolId: "gear:bow" }).match, false);\nassert.equal(compareM5ConflictEvaluation({ legacy: { dice: -1 }, core: { dice: -1, tool: null }, toolId: "" }).match, true);\nconst conflicts = fs.readFileSync("module/conflicts.mjs", "utf8");\nassert.ok(conflicts.includes("evaluateM5ConflictToolLiveHandoff"));\nassert.ok(conflicts.includes("gear: liveGear"));\nconst service = fs.readFileSync("module/m5-core-service.mjs", "utf8");\nassert.ok(service.includes("handoffStatus: getM5ConflictLiveHandoffStatus"));\nassert.ok(service.includes("enableCoreEvaluation"));\nconsole.log("PASS m5-conflict-live-handoff-smoke");\n''')

          Path('TEST_PROTOCOL_v1.7.0-qa.21.md').write_text('''# Realm Guard / Torchbearer v1.7.0-qa.21 QA Protocol\n\n## Scope\nM5 controlled live handoff for Conflict Tool evaluation only. CORE M5 becomes live authority for provider/effect evaluation after a Legacy parity guard. Legacy Mixed still owns all Conflict state writes and exchange flow.\n\n## 1. Initial status\n```js\ngame.system.version\ngame.realmGuard.core.m5.conflictTools.handoffStatus()\n```\nExpected: version `1.7.0-qa.21`, `enabled:true`, `mode:"CORE_EVALUATE_LEGACY_STATE"`, evaluation authority `CORE_M5`, conflict state authority `LEGACY_MIXED`.\n\n## 2. Physical tool match\nReset telemetry. In a Fight, use a physical weapon with a known action modifier (recommended Bow + Maneuver = +2D or Shield + Defend = +2D). Roll the action.\n```js\ngame.realmGuard.core.m5.conflictTools.handoffStatus()\ngame.realmGuard.core.m5.conflictTools.handoffHistory().slice(-5)\n```\nExpected latest evaluation: `CORE_EVALUATION_APPLIED`, `providerMatch:true`, `effectMatch:true`, `evaluationAuthority:"CORE_M5"`. No mismatch/error fallback.\n\n## 3. Unarmed compatibility\nPlan one legal action with no Tool/Weapon. Roll. Expected event `toolKind:"unarmed"`, `dice:-1`, `CORE_EVALUATION_APPLIED`. This verifies the Legacy Mixed profile override remains live.\n\n## 4. Conditional success\nUse Spear on Feint or Axe on Attack. Expected `conditionalSuccess:1` with `CORE_EVALUATION_APPLIED`.\n\n## 5. Narrative/custom tool\nCreate/use a custom Conflict Tool with a dice or success modifier. Expected `toolKind:"narrative"`, provider/effect match and CORE evaluation applied. If the tool has a requirement, also test Requirement met OFF; bonus must become 0 without mismatch.\n\n## 6. Manual rollback\n```js\ngame.realmGuard.core.m5.conflictTools.rollback("QA_MANUAL_ROLLBACK")\n```\nRoll a normal Conflict action. Expected `LEGACY_ROLLBACK`, evaluation authority Legacy Mixed; conflict continues normally.\nRe-enable:\n```js\ngame.realmGuard.core.m5.conflictTools.enableCoreEvaluation()\ngame.realmGuard.core.m5.conflictTools.resetHandoffTelemetry()\n```\n\n## 7. Final regression\nComplete at least one full revealed Action pair. Verify action resolution, disposition change, Maneuver handling where applicable, exchange advancement, chat card and Conflict state remain normal.\nFinal status must show `enabled:true`, `mismatches:0`, `errorFallbacks:0`, `rollbackReason:""`.\n\n## PASS\nPhysical + Unarmed + conditional/custom coverage is green, rollback works, re-enable works, no mismatch/error fallback, and Legacy Conflict state/exchange behavior is unchanged.\n''')

          notes = Path('release/NOTES.md')
          notes.write_text('''Realm Guard / Torchbearer v1.7.0-qa.21 — M5 controlled Conflict Tool evaluation handoff.\n\nqa.20 verified CORE M5 as live Inventory placement validator with Legacy Mixed remaining writer. qa.21 now promotes only Conflict Tool evaluation: provider resolution and action-specific dice/success modifiers are calculated by CORE M5, but only after the live Legacy calculation agrees.\n\nSafety:\n- Legacy Mixed still owns all Conflict state writes, action queue, Maneuver choices, Disarm/disable writes and exchange advancement.\n- Every live Tool evaluation compares CORE against the existing Legacy calculation before CORE values are applied.\n- Any provider/effect disagreement or CORE exception automatically disables CORE evaluation for the session and falls back to Legacy Mixed.\n- Manual rollback and re-enable APIs are exposed for QA.\n- Legacy Mixed Unarmed -1D remains active through the profile override.\n\nPreserved: qa.20 Inventory handoff, qa.19 smart-select scroll fix, M2/M3/M4, Equipment/portrait/token workflows.\n\nQA protocol: TEST_PROTOCOL_v1.7.0-qa.21.md\n''')

          compat = Path('qa/m5-foundry-filepicker-compat-smoke.mjs')
          cs = compat.read_text().replace('1.7.0-qa.20', '1.7.0-qa.21')
          compat.write_text(cs)

          Path('release/READY').write_text('1.7.0-qa.21\n')
          PY

          node --check module/conflicts.mjs
          node --check module/m5-conflict-live-handoff.mjs
          node --check module/m5-core-service.mjs
          for smoke in qa/*-smoke.mjs; do node "$smoke"; done

          rm -f tools/qa21-apply.txt .github/workflows/qa21-conflict-handoff-patch.yml
          git config user.name "GuteboysFactory"
          git config user.email "per@guteboy.eu"
          git add -A
          git commit -m "Release qa.21 M5 conflict evaluation handoff"
          git push
