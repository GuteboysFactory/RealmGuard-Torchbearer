name: Retry qa.4 Exchange Conflict Tool Scope
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa26b-conflict-tool-scope-retry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diagnosed qa.4 patch correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/qa26_apply.py')
          s = p.read_text()
          old = '''old = '''"'"'''  const validatedPlan = plan.map(entry => {\\n    const actor = actorById(entry.actorId);\\n    return { ...entry, weaponId: validateWeaponId(actor, state, "ranger", entry.weaponId ?? rangerWeaponIds[entry.actorId] ?? "") };\\n  });\\n'''"'"'''\nnew = '''"'"'''  const validatedPlan = applyExchangeToolScope(plan, rangerWeaponIds);\\n'''"'"'''\n# Occurs twice: local lock and GM socket handler. Replace both deliberately.\np = Path('module/conflicts.mjs')\ns = p.read_text()\ncount = s.count(old)\nassert count == 2, f'ranger exchange scope: expected 2 matches, found {count}'\np.write_text(s.replace(old, new, 2))'''
          new = '''old_local = '''"'"'''  const validatedPlan = plan.map(entry => {\\n    const actor = actorById(entry.actorId);\\n    return { ...entry, weaponId: validateWeaponId(actor, state, "ranger", entry.weaponId ?? rangerWeaponIds[entry.actorId] ?? "") };\\n  });\\n'''"'"'''\nnew_local = '''"'"'''  const validatedPlan = applyExchangeToolScope(plan, rangerWeaponIds);\\n'''"'"'''\nreplace_once('module/conflicts.mjs', old_local, new_local, 'local Ranger exchange scope')\n\nold_socket = '''"'"'''  const validatedPlan = plan.map(entry => {\\n    const actor = actorById(entry.actorId);\\n    return { ...entry, weaponId: validateWeaponId(actor, state, "ranger", entry.weaponId ?? weaponIds[entry.actorId] ?? "") };\\n  });\\n'''"'"'''\nnew_socket = '''"'"'''  const validatedPlan = applyExchangeToolScope(plan, weaponIds);\\n'''"'"'''\nreplace_once('module/conflicts.mjs', old_socket, new_socket, 'socket Ranger exchange scope')'''
          assert old in s, 'diagnosed qa26 matcher block not found'
          p.write_text(s.replace(old, new, 1))
          PY
          python tools/qa26_apply.py
          node --check realm-guard.mjs
          find module sheets -type f -name '*.mjs' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          for smoke in qa/*-smoke.mjs; do [[ -f "$smoke" ]] || continue; node "$smoke"; done
          git config user.name 'GuteboysFactory'
          git config user.email 'per@guteboy.eu'
          git add module/conflicts.mjs module/core/m6-conflict-tool-scope.mjs realm-guard.mjs system.json qa/m6-conflict-tool-scope-smoke.mjs qa/m5-foundry-filepicker-compat-smoke.mjs TEST_PROTOCOL_v1.8.0-qa.4.md release/NOTES.md
          git commit -m 'Release qa.4 exchange-scoped Conflict Tools'
          git push
