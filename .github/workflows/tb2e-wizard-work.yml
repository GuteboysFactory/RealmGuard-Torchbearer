name: TB2E wizard work checks
on:
  push:
    branches: ["work/tb2e-wizard-qa28"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and existing regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check realm-guard.mjs
          find module sheets -type f -name '*.mjs' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          for smoke in qa/*-smoke.mjs; do
            node "$smoke"
          done
