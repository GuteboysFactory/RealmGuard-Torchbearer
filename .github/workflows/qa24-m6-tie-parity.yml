name: Apply qa.2 M6 Automatic Tie Parity

on:
  push:
    paths:
      - ".github/workflows/qa24-m6-tie-parity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.8.0-qa.2 tie parity patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa24_apply.py
          node --check module/conflicts.mjs
          node --check module/core/m6-conflict-services.mjs
          node --check module/m6-conflict-shadow.mjs
          node --check realm-guard.mjs
          node qa/m6-conflict-shadow-smoke.mjs
          rm -f tools/qa24_apply.py .github/workflows/qa24-m6-tie-parity.yml
          git config user.name "GuteboysFactory"
          git config user.email "per@guteboy.eu"
          git add -A
          git commit -m "Release v1.8.0-qa.2 M6 automatic tie parity"
          git push
