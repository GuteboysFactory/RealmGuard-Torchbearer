name: Apply qa.6 M6 Runtime State
on:
  push:
    paths:
      - 'tools/qa28_apply.py'
      - '.github/workflows/qa28-m6-runtime-state.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.8.0-qa.6 consolidated M6 patch
        run: |
          python tools/qa28_apply.py
          node qa/m6-runtime-state-smoke.mjs
          for f in qa/*-smoke.mjs; do echo "SMOKE $f"; node "$f"; done
      - name: Commit patch
        run: |
          git config user.name 'GuteboysFactory'
          git config user.email 'per@guteboy.eu'
          git add module/conflicts.mjs module/m6-conflict-shadow.mjs module/core/m6-conflict-runtime.mjs module/m6-conflict-state-handoff.mjs realm-guard.mjs system.json qa/m6-runtime-state-smoke.mjs TEST_PROTOCOL_v1.8.0-qa.6.md release/NOTES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Build v1.8.0-qa.6 M6 runtime state authority'
          git push
