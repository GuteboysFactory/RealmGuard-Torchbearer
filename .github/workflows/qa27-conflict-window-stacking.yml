name: Apply qa.5 Conflict Window Stacking
on:
  push:
    paths:
      - '.github/workflows/qa27-conflict-window-stacking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.8.0-qa.5 stacking patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa27_apply.py
          node --check realm-guard.mjs
          find module sheets -type f -name '*.mjs' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          for smoke in qa/*-smoke.mjs; do [[ -f "$smoke" ]] || continue; node "$smoke"; done
          git config user.name 'GuteboysFactory'
          git config user.email 'per@guteboy.eu'
          git add styles/realm-guard.css realm-guard.mjs system.json qa/conflict-window-stacking-smoke.mjs TEST_PROTOCOL_v1.8.0-qa.5.md release/NOTES.md
          git commit -m 'Release qa.5 Conflict window stacking hotfix'
          git push
