name: Apply qa.23c M6 Conflict Shadow

on:
  push:
    paths:
      - ".github/workflows/qa23c-m6-shadow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diagnosed qa.23 source patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa23_apply.py
          node --check module/conflicts.mjs
          node --check module/core/m6-conflict-services.mjs
          node --check module/m6-conflict-shadow.mjs
          node --check realm-guard.mjs
          for smoke in qa/*-smoke.mjs; do node "$smoke"; done
          rm -f tools/qa23_apply.py .github/workflows/qa23-m6-shadow.yml .github/workflows/qa23b-m6-shadow.yml .github/workflows/qa23c-m6-shadow.yml
          git config user.name "GuteboysFactory"
          git config user.email "per@guteboy.eu"
          git add -A
          git commit -m "Release v1.8.0-qa.1 M6 conflict shadow foundation"
          git push
