name: Release Realm Guard / Torchbearer

on:
  workflow_dispatch:
  push:
    paths:
      - "release/READY"

permissions:
  contents: write

concurrency:
  group: realm-guard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate candidate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./system.json').version")"
          test -n "$VERSION"
          if [[ "$VERSION" == *-* ]]; then CHANNEL="qa"; else CHANNEL="stable"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('system.json', 'utf8'));
          const required = ['id', 'title', 'version', 'compatibility', 'esmodules', 'styles', 'languages', 'manifest', 'download'];
          for (const key of required) {
            if (manifest[key] == null) throw new Error(`Manifest missing required field: ${key}`);
          }
          if (manifest.id !== 'realm-guard') throw new Error(`Unexpected system id: ${manifest.id}`);
          if (!/^\d+\.\d+\.\d+(?:\.\d+)*(?:-(?:alpha|beta|rc|qa)\.\d+)?$/.test(manifest.version)) {
            throw new Error(`Unexpected release version: ${manifest.version}`);
          }

          const channel = manifest.version.includes('-') ? 'qa' : 'stable';
          const expectedManifest = `https://raw.githubusercontent.com/GuteboysFactory/RealmGuard-Torchbearer/main/channels/${channel}/system.json`;
          const expectedDownload = `https://github.com/GuteboysFactory/RealmGuard-Torchbearer/releases/download/${manifest.version}/realm-guard.zip`;
          if (manifest.manifest !== expectedManifest) {
            throw new Error(`Candidate manifest must use gated ${channel} channel: ${expectedManifest}`);
          }
          if (manifest.download !== expectedDownload) {
            throw new Error(`Download URL does not match candidate ${manifest.version}: ${manifest.download}`);
          }

          const runtimeFiles = [
            ...(manifest.esmodules || []),
            ...(manifest.styles || []),
            ...((manifest.languages || []).map((entry) => entry.path).filter(Boolean))
          ];
          if (new Set(runtimeFiles).size !== runtimeFiles.length) throw new Error('Manifest contains duplicate runtime references.');
          for (const file of runtimeFiles) {
            if (!fs.existsSync(file)) throw new Error(`Manifest references missing runtime file: ${file}`);
          }
          for (const language of manifest.languages || []) {
            if (!language.lang || !language.name || !language.path) throw new Error('Language entries require lang, name and path.');
            JSON.parse(fs.readFileSync(language.path, 'utf8'));
          }
          NODE

          node --check realm-guard.mjs
          find module sheets -type f -name '*.mjs' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

          for smoke in qa/*-smoke.mjs; do
            [[ -f "$smoke" ]] || continue
            node "$smoke"
          done

          test -f README.md
          test -f styles/realm-guard.css
          test -f lang/en.json
          test -f channels/qa/system.json
          test -f channels/stable/system.json

      - name: Build Foundry system package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/realm-guard-release
          mkdir -p dist /tmp/realm-guard-release

          rsync -a ./ /tmp/realm-guard-release/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude 'release/' \
            --exclude 'channels/' \
            --exclude 'realm-guard-foundry-v*.zip'

          cp system.json dist/system.json
          cd /tmp/realm-guard-release
          zip -qr "$GITHUB_WORKSPACE/dist/realm-guard.zip" .
          unzip -t "$GITHUB_WORKSPACE/dist/realm-guard.zip"

          unzip -Z1 "$GITHUB_WORKSPACE/dist/realm-guard.zip" | grep -qx 'system.json'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/realm-guard.zip" | grep -qx 'realm-guard.mjs'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/realm-guard.zip" | grep -qx 'styles/realm-guard.css'
          unzip -Z1 "$GITHUB_WORKSPACE/dist/realm-guard.zip" | grep -qx 'lang/en.json'

          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const m = JSON.parse(fs.readFileSync('system.json', 'utf8'));
          const listed = cp.execFileSync('unzip', ['-Z1', 'dist/realm-guard.zip'], { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' })
            .split(/\r?\n/).filter(Boolean);
          const files = new Set(listed);
          for (const file of [...(m.esmodules || []), ...(m.styles || []), ...((m.languages || []).map((entry) => entry.path).filter(Boolean))]) {
            if (!files.has(file)) throw new Error(`Release ZIP is missing manifest runtime file: ${file}`);
          }
          const forbiddenPrefixes = ['.git/', '.github/', 'dist/', 'release/', 'channels/'];
          for (const file of listed) {
            if (forbiddenPrefixes.some((prefix) => file.startsWith(prefix))) throw new Error(`Release ZIP contains excluded path: ${file}`);
            if (/^realm-guard-foundry-v.*\.zip$/.test(file)) throw new Error(`Release ZIP contains legacy nested package: ${file}`);
          }
          NODE

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE_ARGS+=(--prerelease); fi

          NOTES_ARGS=()
          if [[ -f release/NOTES.md ]]; then
            NOTES_ARGS+=(--notes-file release/NOTES.md)
          else
            NOTES_ARGS+=(--notes "Realm Guard / Torchbearer $VERSION")
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/system.json dist/realm-guard.zip --clobber
          else
            gh release create "$VERSION" dist/system.json dist/realm-guard.zip \
              --target "$GITHUB_SHA" \
              --title "Realm Guard / Torchbearer $VERSION" \
              "${NOTES_ARGS[@]}" \
              "${PRERELEASE_ARGS[@]}"
          fi

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf /tmp/realm-guard-verify
          mkdir -p /tmp/realm-guard-verify

          gh release download "$VERSION" \
            --dir /tmp/realm-guard-verify \
            --pattern 'system.json' \
            --pattern 'realm-guard.zip'

          test -s /tmp/realm-guard-verify/system.json
          test -s /tmp/realm-guard-verify/realm-guard.zip
          unzip -t /tmp/realm-guard-verify/realm-guard.zip >/dev/null

          node <<'NODE'
          const fs = require('fs');
          const local = JSON.parse(fs.readFileSync('system.json','utf8'));
          const published = JSON.parse(fs.readFileSync('/tmp/realm-guard-verify/system.json','utf8'));
          if (published.version !== local.version) throw new Error(`Published manifest version mismatch: ${published.version} != ${local.version}`);
          if (published.download !== local.download) throw new Error('Published manifest download URL differs from candidate.');
          if (published.manifest !== local.manifest) throw new Error('Published manifest channel differs from candidate.');
          NODE

      - name: Promote verified release to update channel
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          CHANNEL: ${{ steps.manifest.outputs.channel }}
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "main advanced during release; refusing to move $CHANNEL channel from a stale build."
            exit 1
          fi

          mkdir -p "channels/$CHANNEL"
          cp dist/system.json "channels/$CHANNEL/system.json"

          git config user.name "realm-guard-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "channels/$CHANNEL/system.json"

          if git diff --cached --quiet; then
            echo "$CHANNEL channel already points at $VERSION."
            exit 0
          fi

          git commit -m "release: promote $VERSION to $CHANNEL channel [skip ci]"
          git push origin HEAD:main

      - name: Confirm channel only moved after verification
        shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          CHANNEL: ${{ steps.manifest.outputs.channel }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            CHANNEL_JSON="$(curl -fsSL "https://raw.githubusercontent.com/GuteboysFactory/RealmGuard-Torchbearer/main/channels/$CHANNEL/system.json?attempt=$attempt" || true)"
            if [[ -n "$CHANNEL_JSON" ]]; then
              CHANNEL_VERSION="$(printf '%s' "$CHANNEL_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")"
              if [[ "$CHANNEL_VERSION" == "$VERSION" ]]; then
                echo "$CHANNEL channel is live at $VERSION."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "$CHANNEL channel did not become visible at $VERSION."
          exit 1
