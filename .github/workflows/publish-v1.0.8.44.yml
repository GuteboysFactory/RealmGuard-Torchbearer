name: Publish Realm Guard v1.0.8.44 package

on:
  push:
    branches:
      - main
    paths:
      - 'release-upload/v1.0.8.44/READY'

permissions:
  contents: write

jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat release-upload/v1.0.8.44/chunk-* | base64 --decode > realm-guard-foundry-v1.0.8.44.zip
          echo "fb0573dda64b819d0b7289c57c5b88b2f75ebaedbdceb829e453f3118947aad0  realm-guard-foundry-v1.0.8.44.zip" | sha256sum -c -
          unzip -t realm-guard-foundry-v1.0.8.44.zip >/dev/null

      - name: Commit verified package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GuteboysFactory Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add realm-guard-foundry-v1.0.8.44.zip
          git rm -r release-upload/v1.0.8.44
          git commit -m "Publish Realm Guard / Torchbearer v1.0.8.44 package"
          git push origin HEAD:main
